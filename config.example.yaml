bark:
  # Bark 推送服务器地址和设备 key
  # 格式: https://api.day.app/YOUR_DEVICE_KEY
  server: "https://api.day.app"
  device_key: ""  # 在 Bark App 中获取

# 推送行为配置
notification:
  # 防抖间隔（秒），同一 session 内连续事件不重复推送
  debounce_seconds: 3
  # 是否推送 Stop 事件（Claude 完成一轮对话）
  notify_on_stop: true
  # 是否推送 Notification 事件
  notify_on_notification: true
  # 静默时段（不推送），格式 HH:MM
  quiet_start: ""
  quiet_end: ""

# 宠物配置
pet:
  enabled: true
  # 宠物在屏幕上的初始位置
  position_x: 100
  position_y: 100
  # 宠物大小
  size: 80

# 服务端口
server:
  host: "127.0.0.1"
  port: 6789

# 监控的 agent 列表
agents:
  claude_code:
    enabled: true
    events:
      - "Stop"
      - "Notification"
