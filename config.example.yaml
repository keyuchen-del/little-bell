# ============================================================
# 小铃铛 (Little Bell) 配置文件
# ============================================================

# --- macOS 系统通知 (默认开启，零配置) ---
macos_notification:
  enabled: true  # 关闭后不弹 macOS 通知

# --- Bark (iOS 推送) ---
# 下载: https://apps.apple.com/app/bark/id1403753865
# 打开 App 首页即可看到你的 Device Key
bark:
  server: "https://api.day.app"
  device_key: ""  # 填入你的 Bark Device Key

# --- 通用 Webhook (飞书/钉钉/Slack/Discord/企业微信) ---
# 填入对应机器人的 Webhook URL 即可
webhook:
  url: ""  # 例: https://open.feishu.cn/open-apis/bot/v2/hook/xxx
  method: "POST"
  headers:
    Content-Type: "application/json"
  # 消息体模板，{{title}} 和 {{body}} 会被替换
  # 留空则使用默认 JSON: {"title": "...", "body": "...", "source": "little-bell"}
  # 飞书示例: '{"msg_type":"text","content":{"text":"{{title}}: {{body}}"}}'
  # 钉钉示例: '{"msgtype":"text","text":{"content":"{{title}}: {{body}}"}}'
  body_template: ""

# --- 规则引擎 (自动批准/拒绝，减少手动干预) ---
# 匹配格式: "Tool" 匹配所有该工具操作, "Tool:pattern*" 匹配具体内容
rules:
  auto_allow:
    - "Read"                     # 所有读文件操作自动批准
    - "Bash:ls *"                # ls 命令自动批准
    - "Bash:git status"          # git status 自动批准
    - "Bash:git diff*"           # git diff 相关自动批准
    - "Bash:cat *"               # cat 命令自动批准
  auto_deny:
    - "Bash:rm -rf /*"           # 根目录删除永远拒绝
    - "Bash:sudo *"              # sudo 永远拒绝
    # - "Bash:git push --force*" # 取消注释启用

# --- 推送行为 ---
notification:
  debounce_seconds: 3      # 同一 session 内 N 秒内不重复推送
  notify_on_stop: true     # Agent 完成一轮对话时推送
  notify_on_notification: true  # Agent 主动通知时推送

# --- 桌面宠物 ---
pet:
  enabled: true
  position_x: 100
  position_y: 100
  size: 80

# --- 本地服务 ---
server:
  host: "0.0.0.0"   # 绑定 0.0.0.0 让手机局域网可访问
  port: 6789

# --- 监听的 Agent ---
agents:
  claude_code:
    enabled: true
    events: ["Stop", "Notification"]
