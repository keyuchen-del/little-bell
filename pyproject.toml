[project]
name = "little-bell"
version = "0.1.0"
description = "小铃铛 - AI Agent 停下来等你时，手机立刻响。macOS 菜单栏 + Bark/Webhook 推送 + 桌面宠物。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "keyuchen-del", email = "keyuchen@example.com" }]
keywords = ["ai-agent", "notification", "claude-code", "macos", "bark", "menubar", "desktop-pet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Tools",
]
dependencies = [
    "flask>=3.1.3",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rumps>=0.4.0",
]

[project.scripts]
little-bell = "little_bell.app:main"

[project.urls]
Homepage = "https://github.com/Jackychen-12/little-bell"
Repository = "https://github.com/Jackychen-12/little-bell"
Issues = "https://github.com/Jackychen-12/little-bell/issues"
